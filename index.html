<!DOCTYPE html>
<html>
<head>
    <title>Gym Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <h1>GYM FEEDBACK</h1>
        <p style="text-align: center;">
            Share your experience and help us improve our gym.
        </p>
    </div>

    <div class="card">
        <h2>Feedback Form</h2>

        <form>

            <!-- INPUT FIELD 1 -->
            <div class="input-group">
                <label for="nameInput">1. Name:</label>
                <input type="text" id="nameInput"
                       placeholder="Enter your full name">
            </div>

            <!-- INPUT FIELD 2 -->
            <div class="input-group">
                <label for="emailInput">2. Email Address:</label>
                <input type="email" id="emailInput"
                       placeholder="Enter your email">
            </div>

            <!-- INPUT FIELD 3 -->
            <div class="input-group">
                <label for="ageInput">3. Age:</label>
                <input type="number" id="ageInput"
                       placeholder="Enter your age">
            </div>

            <!-- INPUT FIELD 4 -->
            <div class="input-group">
                <label for="visitInput">
                    4. How often do you visit the gym?
                </label>

                <select id="visitInput">
                    <option value="">--Select an Option--</option>
                    <option>Everyday</option>
                    <option>3-5 times a week</option>
                    <option>1-2 times a week</option>
                    <option>Occasionally</option>
                </select>
            </div>

            <!-- INPUT FIELD 5 -->
            <div class="input-group">
                <label for="workoutInput">
                    5. What type of workout do you usually do?
                </label>

                <select id="workoutInput">
                    <option value="">--Select Workout--</option>
                    <option>Weight Training</option>
                    <option>Cardio</option>
                    <option>Bodybuilding</option>
                    <option>CrossFit</option>
                    <option>Calisthenics</option>
                    <option>Mixed Workout</option>
                </select>
            </div>

            <!-- INPUT FIELD 6 -->
            <div class="input-group">
                <label for="equipmentInput">
                    6. Gym Equipment:
                </label>

                <select id="equipmentInput">
                    <option value="">--Select Rating--</option>
                    <option>Excellent</option>
                    <option>Good</option>
                    <option>Average</option>
                    <option>Poor</option>
                </select>
            </div>

            <!-- INPUT FIELD 7 -->
            <div class="input-group">
                <label for="cleanlinessInput">
                    7. Gym Cleanliness:
                </label>

                <select id="cleanlinessInput">
                    <option value="">--Select Rating--</option>
                    <option>Very Clean</option>
                    <option>Clean</option>
                    <option>Average</option>
                    <option>Needs Improvement</option>
                </select>
            </div>

            <!-- INPUT FIELD 8 -->
            <div class="input-group">
                <label for="staffInput">
                    8. Staff Service:
                </label>

                <select id="staffInput">
                    <option value="">--Select Rating--</option>
                    <option>Excellent</option>
                    <option>Good</option>
                    <option>Average</option>
                    <option>Poor</option>
                </select>
            </div>

            <!-- INPUT FIELD 9 -->
            <div class="input-group">
                <label for="environmentInput">
                    9. Gym Environment:
                </label>

                <select id="environmentInput">
                    <option value="">--Select Rating--</option>
                    <option>Very Comfortable</option>
                    <option>Comfortable</option>
                    <option>Average</option>
                    <option>Uncomfortable</option>
                </select>
            </div>

            <!-- INPUT FIELD 10 -->
            <div class="input-group">
                <label for="ratingInput">
                    10. Overall Rating:
                </label>

                <select id="ratingInput">
                    <option value="">--Select Rating--</option>
                    <option>★★★★★ Excellent</option>
                    <option>★★★★☆ Very Good</option>
                    <option>★★★☆☆ Good</option>
                    <option>★★☆☆☆ Fair</option>
                    <option>★☆☆☆☆ Poor</option>
                </select>
            </div>

            <!-- INPUT FIELD 11 -->
            <div class="input-group">
                <label for="likedInput">
                    11. What did you like most about the gym?
                </label>

                <textarea id="likedInput"
                          placeholder="Tell us what you liked..."></textarea>
            </div>

            <!-- INPUT FIELD 12 -->
            <div class="input-group">
                <label for="improveInput">
                    12. What can we improve?
                </label>

                <textarea id="improveInput"
                          placeholder="Tell us what we can improve..."></textarea>
            </div>

            <!-- INPUT FIELD 13 -->
            <div class="input-group">
                <label for="additionalInput">
                    13. Additional Feedback:
                </label>

                <textarea id="additionalInput"
                          placeholder="Write your additional comments..."></textarea>
            </div>

            <!-- INPUT FIELD 14 -->
            <div class="input-group">
                <label for="recommendInput">
                    14. Would you recommend our gym?
                </label>

                <select id="recommendInput">
                    <option value="">--Select an Option--</option>
                    <option>Definitely Yes</option>
                    <option>Maybe</option>
                    <option>No</option>
                </select>
            </div>

            <button type="submit">Submit Feedback</button>

        </form>
    </div>

    <!-- OUTPUT SECTION -->
    <div class="card output-section" id="outputSection">

        <h2>Feedback Output</h2>

        <p><strong>Name:</strong>
            <span id="outputName"></span>
        </p>

        <p><strong>Email:</strong>
            <span id="outputEmail"></span>
        </p>

        <p><strong>Age:</strong>
            <span id="outputAge"></span>
        </p>

        <p><strong>Gym Visit:</strong>
            <span id="outputVisit"></span>
        </p>

        <p><strong>Workout Type:</strong>
            <span id="outputWorkout"></span>
        </p>

        <p><strong>Gym Equipment:</strong>
            <span id="outputEquipment"></span>
        </p>

        <p><strong>Gym Cleanliness:</strong>
            <span id="outputCleanliness"></span>
        </p>

        <p><strong>Staff Service:</strong>
            <span id="outputStaff"></span>
        </p>

        <p><strong>Gym Environment:</strong>
            <span id="outputEnvironment"></span>
        </p>

        <p><strong>Overall Rating:</strong>
            <span id="outputRating"></span>
        </p>

        <p><strong>Liked Most:</strong>
            <span id="outputLiked"></span>
        </p>

        <p><strong>Improvements:</strong>
            <span id="outputImprove"></span>
        </p>

        <p><strong>Additional Feedback:</strong>
            <span id="outputAdditional"></span>
        </p>

        <p><strong>Recommend Gym:</strong>
            <span id="outputRecommend"></span>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
